
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Setup Android SDK
        run: |
          echo "y" | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP
        run: unzip KasirWarungKopiAceh-source.zip -d extracted

      - name: Build APK
        run: gradle -p extracted/KasirWarungKopiAceh :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KasirWarungKopiAceh-APK
          path: extracted/KasirWarungKopiAceh/app/build/outputs/apk/debug/app-debug.apk
