
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip KasirWarungKopiAceh-source.zip -d extracted

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("extracted/KasirWarungKopiAceh/app/build.gradle.kts")
          if not p.is_file():
              raise SystemExit(f"File tidak ditemukan: {p}")

          s = p.read_text()

          # Set Java source and target compatibility to Java 17.
          s = re.sub(
              r'JavaVersion\.VERSION_1_[0-9]+',
              'JavaVersion.VERSION_17',
              s
          )

          # Update existing Kotlin JVM target declarations to 17.
          s = re.sub(
              r'jvmTarget\s*=\s*["\'][^"\']+["\']',
              'jvmTarget = "17"',
              s
          )

          # Ensure compileOptions exists inside the android block.
          if not re.search(r'compileOptions\s*\{', s):
              android_match = re.search(r'android\s*\{', s)
              if not android_match:
                  raise SystemExit("Blok android { } tidak ditemukan.")
              start = android_match.end()
              s = s[:start] + """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """ + s[start:]
          else:
              s = re.sub(
                  r'sourceCompatibility\s*=\s*JavaVersion\.[A-Z0-9_]+',
                  'sourceCompatibility = JavaVersion.VERSION_17',
                  s
              )
              s = re.sub(
                  r'targetCompatibility\s*=\s*JavaVersion\.[A-Z0-9_]+',
                  'targetCompatibility = JavaVersion.VERSION_17',
                  s
              )

          # If Kotlin options already exist, the target is set above.
          p.write_text(s)
          print("File Gradle berhasil diperbarui.")
          PY

      - name: Verify JVM targets
        run: |
          grep -nE 'compileOptions|sourceCompatibility|targetCompatibility|kotlinOptions|jvmTarget' extracted/KasirWarungKopiAceh/app/build.gradle.kts || true

      - name: Build APK
        run: gradle -p extracted/KasirWarungKopiAceh :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KasirWarungKopiAceh-APK
          path: extracted/KasirWarungKopiAceh/app/build/outputs/apk/debug/app-debug.apk
