
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip KasirWarungKopiAceh-source.zip -d extracted

      - name: Fix Java target
        run: |
          FILE="extracted/KasirWarungKopiAceh/app/build.gradle.kts"
          if [ ! -f "$FILE" ]; then
            echo "File build.gradle.kts tidak ditemukan"
            exit 1
          fi
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$FILE"

      - name: Build APK
        run: gradle -p extracted/KasirWarungKopiAceh :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KasirWarungKopiAceh-APK
          path: extracted/KasirWarungKopiAceh/app/build/outputs/apk/debug/app-debug.apk
